<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>For Ayesha ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 2s ease;
            max-width: 500px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #b30059;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #4a0033;
            min-height: 80px;
            animation: quoteFade 1s ease;
        }

        button {
            margin-top: 25px;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: #ff4d88;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e6005c;
            transform: scale(1.05);
        }

        /* Floating hearts */

        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 20px;
            color: rgba(255, 0, 85, 0.7);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            to {
                transform: translateY(-100vh) scale(1.8);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes quoteFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Ayesha ❤️</h1>
        <p id="quote">You are my favorite reason to smile.</p>
        <button onclick="changeQuote()">Next Quote</button>
    </div>

    <script>
        const quotes = [
            "Ayesha, you are my favorite reason to smile.",
            "Every moment with you, Ayesha, feels like magic.",
            "My heart feels at home when I think of you, Ayesha.",
            "You make my world brighter just by being in it, Ayesha.",
            "Loving you, Ayesha, is the most beautiful feeling ever.",
            "You are the calm in my chaos, Ayesha."
        ];

        let index = 0;

        function changeQuote() {
            index = (index + 1) % quotes.length;
            const quoteEl = document.getElementById("quote");
            quoteEl.style.opacity = 0;

            setTimeout(() => {
                quoteEl.textContent = quotes[index];
                quoteEl.style.opacity = 1;
            }, 300);
        }

        // Create floating hearts
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (3 + Math.random() * 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }, 400);
    </script>

</body>

</html>
